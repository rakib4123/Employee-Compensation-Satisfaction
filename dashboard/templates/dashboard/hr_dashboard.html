{% extends "dashboard/base.html" %}
{% load static %}
{% block title %}Dashboard — DRIKON TECH{% endblock %}
{% block content %}
{{ employees|json_script:"employees-data" }}
<div x-data="employeeDirectory(JSON.parse(document.getElementById('employees-data').textContent))">
  <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8" x-data x-init="$nextTick(() => staggerCards($el))">
    <div class="rounded-3xl bg-white/40 dark:bg-slate-900/40 backdrop-blur-3xl border border-white/40 border-t-white/80 dark:border-slate-700/40 dark:border-t-slate-500/50 shadow-2xl p-6 transition-all duration-500 hover:-translate-y-1.5 hover:shadow-indigo-500/10 hover:bg-white/50 dark:hover:bg-slate-800/50 relative z-10" x-data x-init="animateCountUp($el.querySelector('.stat-value'), {{ headcount }})">
      <div class="flex items-center justify-between mb-3">
        <p class="text-sm uppercase tracking-wider font-semibold text-slate-500">Headcount</p>
        <span class="w-8 h-8 rounded-lg bg-indigo-50 dark:bg-indigo-900/40 text-indigo-600 dark:text-indigo-300 flex items-center justify-center">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <circle cx="9" cy="8" r="3"/>
            <path stroke-linecap="round" d="M3 20c0-3.314 2.686-6 6-6s6 2.686 6 6"/>
            <circle cx="17" cy="8.5" r="2.25"/>
            <path stroke-linecap="round" d="M15.5 14.75c2.4.35 4.25 2.35 4.25 5.25"/>
          </svg>
        </span>
      </div>
      <p class="stat-value text-4xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-fuchsia-600 dark:from-indigo-400 dark:to-fuchsia-400 tracking-tight">0</p>
    </div>
    <div class="rounded-3xl bg-white/40 dark:bg-slate-900/40 backdrop-blur-3xl border border-white/40 border-t-white/80 dark:border-slate-700/40 dark:border-t-slate-500/50 shadow-2xl p-6 transition-all duration-500 hover:-translate-y-1.5 hover:shadow-indigo-500/10 hover:bg-white/50 dark:hover:bg-slate-800/50 relative z-10" x-data x-init="animateCountUp($el.querySelector('.stat-value'), {{ total_payroll }}, { prefix: '৳' })">
      <div class="flex items-center justify-between mb-3">
        <p class="text-sm uppercase tracking-wider font-semibold text-slate-500">Total Payroll</p>
        <span class="w-8 h-8 rounded-lg bg-emerald-50 dark:bg-emerald-900/40 text-emerald-600 dark:text-emerald-300 flex items-center justify-center">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <rect x="3" y="6" width="18" height="13" rx="2"/>
            <path stroke-linecap="round" d="M3 10.5h18"/>
            <circle cx="16.5" cy="14.25" r="1.35" fill="currentColor" stroke="none"/>
          </svg>
        </span>
      </div>
      <p class="stat-value text-4xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-emerald-600 to-teal-600 dark:from-emerald-400 dark:to-teal-400 tracking-tight">৳0</p>
    </div>
    <div class="rounded-3xl bg-white/40 dark:bg-slate-900/40 backdrop-blur-3xl border border-white/40 border-t-white/80 dark:border-slate-700/40 dark:border-t-slate-500/50 shadow-2xl p-6 transition-all duration-500 hover:-translate-y-1.5 hover:shadow-indigo-500/10 hover:bg-white/50 dark:hover:bg-slate-800/50 relative z-10" x-data x-init="animateCountUp($el.querySelector('.stat-value'), {{ avg_salary }}, { prefix: '৳' })">
      <div class="flex items-center justify-between mb-3">
        <p class="text-sm uppercase tracking-wider font-semibold text-slate-500">Avg Salary</p>
        <span class="w-8 h-8 rounded-lg bg-amber-50 dark:bg-amber-900/40 text-amber-600 dark:text-amber-300 flex items-center justify-center">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 20V10M10 20V4M16 20v-7M4 20h16"/>
          </svg>
        </span>
      </div>
      <p class="stat-value text-4xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-amber-500 to-orange-500 dark:from-amber-400 dark:to-orange-400 tracking-tight">৳0</p>
    </div>
  </div>

  <div class="rounded-3xl bg-white/40 dark:bg-slate-900/40 backdrop-blur-3xl border border-white/40 border-t-white/80 dark:border-slate-700/40 dark:border-t-slate-500/50 shadow-2xl p-6 relative z-10">
    <div class="flex items-center justify-between mb-4">
      <input x-model="query" type="text" placeholder="Search employees..."
             class="w-64 rounded-lg border border-slate-300 dark:border-slate-600 bg-transparent px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
    </div>

    <template x-if="loading">
      <div class="space-y-2 animate-pulse">
        <div class="h-10 bg-slate-100 dark:bg-slate-700 rounded"></div>
        <div class="h-10 bg-slate-100 dark:bg-slate-700 rounded"></div>
        <div class="h-10 bg-slate-100 dark:bg-slate-700 rounded"></div>
      </div>
    </template>

    <table class="w-full text-sm" x-show="!loading">
      <thead>
        <tr class="text-left text-slate-500 border-b border-slate-200 dark:border-slate-700">
          <th class="py-2">Name</th>
          <th class="py-2">Designation</th>
          <th class="py-2">Department</th>
          <th class="py-2">Experience</th>
          <th class="py-2 text-right">Salary</th>
        </tr>
      </thead>
      <tbody x-ref="tbody">
        <template x-for="employee in filtered" :key="employee.id">
          <tr class="group border-b border-slate-200/40 dark:border-slate-700/40 hover:bg-white/60 dark:hover:bg-slate-800/60 transition-colors cursor-pointer">
            <td class="py-2 flex items-center gap-2">
              <span class="w-7 h-7 rounded-full bg-indigo-100 dark:bg-indigo-900 text-indigo-600 dark:text-indigo-300 text-xs flex items-center justify-center font-medium" x-text="employee.initials"></span>
              <span x-text="employee.name"></span>
            </td>
            <td class="py-2" x-text="employee.designation"></td>
            <td class="py-2" x-text="employee.department"></td>
            <td class="py-2" x-text="employee.experience_years + ' yrs'"></td>
            <td class="py-2 text-right" x-text="'৳' + employee.salary.toLocaleString()"></td>
          </tr>
        </template>
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
