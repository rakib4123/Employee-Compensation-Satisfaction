<aside class="w-60 shrink-0 bg-white/40 dark:bg-slate-900/40 backdrop-blur-3xl border-r border-white/40 dark:border-slate-700/40 flex flex-col print:hidden relative z-20 shadow-[1px_0_20px_rgba(0,0,0,0.03)] dark:shadow-[1px_0_20px_rgba(0,0,0,0.2)]">
  <a href="#" onclick="location.reload(); return false;" class="px-5 py-4 flex items-center gap-2.5 hover:opacity-80 transition cursor-pointer">
    <span class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-indigo-700 text-white flex items-center justify-center font-bold text-sm shadow-sm">D</span>
    <span class="text-lg font-semibold">DRIKON TECH</span>
  </a>
  <nav class="flex-1 px-3 space-y-1">
    {% if user.role == "hr" %}
      <a href="{% url 'hr_dashboard' %}"
         class="flex items-center gap-2.5 rounded-lg px-3 py-2 text-sm font-medium transition {% if request.path == '/dashboard/' %}bg-indigo-50 text-indigo-600 dark:bg-indigo-900/50 dark:text-indigo-300{% else %}hover:bg-slate-100 dark:hover:bg-slate-700{% endif %}">
        <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/>
          <rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/>
          <rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/>
          <rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/>
        </svg>
        Dashboard
      </a>
      <a href="{% url 'compensation:audit_dashboard' %}"
         class="flex items-center gap-2.5 rounded-lg px-3 py-2 text-sm font-medium transition {% if '/compensation/' in request.path %}bg-indigo-50 text-indigo-600 dark:bg-indigo-900/50 dark:text-indigo-300{% else %}hover:bg-slate-100 dark:hover:bg-slate-700{% endif %}">
        <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 20V10M10 20V4M16 20v-7M4 20h16"/>
        </svg>
        Compensation Insights
      </a>
    {% else %}
      <a href="{% url 'employee_self_service' %}"
         class="flex items-center gap-2.5 rounded-lg px-3 py-2 text-sm font-medium transition {% if request.path == '/me/' %}bg-indigo-50 text-indigo-600 dark:bg-indigo-900/50 dark:text-indigo-300{% else %}hover:bg-slate-100 dark:hover:bg-slate-700{% endif %}">
        <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="8" r="3.25"/>
          <path stroke-linecap="round" d="M5 20c0-3.866 3.134-7 7-7s7 3.134 7 7"/>
        </svg>
        My Profile
      </a>
    {% endif %}
  </nav>
</aside>
