<header class="h-16 flex items-center justify-end px-6 border-b border-white/40 dark:border-slate-700/40 bg-white/40 dark:bg-slate-900/40 backdrop-blur-3xl print:hidden relative z-20 shadow-[0_1px_20px_rgba(0,0,0,0.03)] dark:shadow-[0_1px_20px_rgba(0,0,0,0.2)]">
  <div class="flex items-center gap-3">
    <button @click="dark = !dark" type="button" aria-label="Toggle theme"
            class="p-2 rounded-lg text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-700 hover:text-slate-900 dark:hover:text-white transition">
      <svg x-show="!dark" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z"/>
      </svg>
      <svg x-show="dark" x-cloak class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="12" r="3.75"/>
        <path stroke-linecap="round" d="M12 3v2.25M12 18.75V21M4.222 4.222l1.591 1.591M18.187 18.187l1.591 1.591M3 12h2.25M18.75 12H21M4.222 19.778l1.591-1.591M18.187 5.813l1.591-1.591"/>
      </svg>
    </button>
    <div class="relative" x-data="{ open: false }">
      <button @click="open = !open" type="button"
              class="flex items-center gap-2 text-sm font-medium rounded-lg pl-1.5 pr-2.5 py-1.5 hover:bg-slate-100 dark:hover:bg-slate-700 transition">
        <span class="w-7 h-7 rounded-full bg-indigo-100 dark:bg-indigo-900 text-indigo-600 dark:text-indigo-300 text-xs flex items-center justify-center font-semibold">{{ user.first_name|default:user.username|slice:":1"|upper }}</span>
        {{ user.first_name|default:user.username }}
      </button>
      <div x-show="open" x-transition.origin.top.right @click.outside="open = false" x-cloak
           class="absolute right-0 mt-2 w-56 z-50 rounded-2xl bg-white/70 dark:bg-slate-800/70 backdrop-blur-3xl shadow-2xl border border-white/40 dark:border-slate-700/50 py-2">
        <div class="px-4 py-3 border-b border-slate-200/50 dark:border-slate-700/50 mb-1">
          <p class="text-sm font-semibold text-slate-900 dark:text-white truncate">{{ user.first_name }} {{ user.last_name }}</p>
          <p class="text-xs text-slate-500 dark:text-slate-400 truncate">{{ user.email }}</p>
          <p class="text-[10px] font-bold uppercase tracking-wider text-indigo-500 mt-1">{{ user.role }}</p>
        </div>
        <a href="{% url 'user_profile' %}" class="block w-full text-left px-4 py-2 text-sm text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700/50 transition">My Profile</a>
        <form method="post" action="{% url 'logout' %}">
          {% csrf_token %}
          <button type="submit" class="block w-full text-left px-4 py-2 text-sm text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-500/10 transition">Sign out</button>
        </form>
      </div>
    </div>
  </div>
</header>
